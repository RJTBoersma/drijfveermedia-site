# Bouwt de site bij elke wijziging (ook vanuit /admin/) en zet hem via FTP op Vimexx.
# De build keurt zichzelf af als de tekstcontrole iets vindt; dan blijft de oude versie online.
name: Bouwen en publiceren
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publiceren
  cancel-in-progress: true
jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lanceercheck
      - name: Naar Vimexx (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_MAP || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
